const $=id=>document.getElementById(id);
async function unlock(pw){
  if(!window.crypto||!crypto.subtle) throw new Error('insecure');
  const raw=Uint8Array.from(atob(P),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct));
}
function inject(html){
  // hands the page URL (#lender), its own address and an optional "back" address to the dashboard inside
  const base=location.href.split('#')[0];
  let js='window.__HASH__='+JSON.stringify(location.hash||'')+';window.__ROOT__='+JSON.stringify(base)+';';
  if(BACK) js+='window.__BACK__='+JSON.stringify(new URL('../',base).href)+';';
  js=js.replace(/</g,'\\u003c');
  const tag='<script>'+js+'<\/script>';
  return html.indexOf('<head>')>=0 ? html.replace('<head>',()=>'<head>'+tag) : html;
}
async function tryOpen(pw,remember,auto){
  $('err').textContent='';
  try{
    const html=inject(await unlock(pw));
    if(remember) localStorage.setItem('dash_pw',pw);
    if(SESS){ try{sessionStorage.setItem('dash_pw',pw);}catch(e){} }
    document.body.style.cssText='margin:0;display:block;background:#f4f6fa';
    document.body.innerHTML='';
    const f=document.createElement('iframe'); f.style.cssText='border:0;width:100%;height:100vh;display:block';
    f.srcdoc=html; document.body.appendChild(f);
  }catch(e){
    if(auto){ try{localStorage.removeItem('dash_pw');sessionStorage.removeItem('dash_pw');}catch(_){} return; }
    $('err').textContent = e.message==='insecure' ? 'Open this page using its https:// link.' : 'Wrong password.';
  }
}
$('go').onclick=()=>tryOpen($('pw').value,$('rm').checked,false);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('go').click();});
if(!REM){ try{localStorage.removeItem('dash_pw');}catch(e){} }
let saved=null; try{ saved=(REM?localStorage.getItem('dash_pw'):null)||(SESS?sessionStorage.getItem('dash_pw'):null); }catch(e){}
if(saved) tryOpen(saved,false,true);
